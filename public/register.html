<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register | CampusConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="max-width: 450px; margin-top: 4rem;">
    <div class="card">
      <h2>Create Account</h2>
      <form id="regForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required>
        </div>
        <div class="form-group">
          <label>Register As</label>
          <select id="role">
            <option value="student">Student</option>
            <option value="recruiter">Recruiter</option>
          </select>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Register</button>
      </form>
      <p style="margin-top: 1rem; text-align: center;">Already registered? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      try {
        await apiRequest('/auth/register', 'POST', { name, email, password, role });
        alert('Registration successful! Please login.');
        window.location.href = '/login.html';
      } catch (err) {}
    });
  </script>
</body>
</html>
