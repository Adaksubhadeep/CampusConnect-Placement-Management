<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Portal | CampusConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <h2>CampusConnect - Student Portal</h2>
    <button onclick="logout()" class="btn" style="background:#dc2626;">Logout</button>
  </nav>

  <div class="container">
    <div class="card">
      <h3>Update My Profile</h3>
      <form id="profileForm" class="grid" style="grid-template-columns: 1fr 1fr; margin-top: 1rem;">
        <div class="form-group"><label>Phone</label><input type="text" id="phone" required></div>
        <div class="form-group"><label>College</label><input type="text" id="college" required></div>
        <div class="form-group"><label>Branch</label><input type="text" id="branch" required></div>
        <div class="form-group"><label>CGPA</label><input type="number" step="0.1" id="cgpa" required></div>
        <div class="form-group"><label>Skills (comma separated)</label><input type="text" id="skills" required></div>
        <div class="form-group"><label>Graduation Year</label><input type="number" id="gradYear" required></div>
        <button type="submit" class="btn" style="grid-column: span 2;">Save Profile</button>
      </form>
    </div>

    <div class="card">
      <h3>Available Job Openings</h3>
      <div id="jobsList" style="margin-top: 1rem;"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    checkAuth('student');

    async function loadJobs() {
      const jobs = await apiRequest('/jobs');
      const container = document.getElementById('jobsList');
      container.innerHTML = jobs.map(j => `
        <div class="card" style="border: 1px solid #ddd; box-shadow:none;">
          <h4>${j.title} - ${j.companyId ? j.companyId.companyName : 'Company'}</h4>
          <p>Location: ${j.location} | Salary: ₹${j.salary} | Min CGPA: ${j.minCgpa}</p>
          <p>Skills: ${j.skills.join(', ')}</p>
          <button class="btn" style="margin-top: 0.5rem;" onclick="apply('${j._id}')">Apply Now</button>
        </div>
      `).join('');
    }

    async function apply(jobId) {
      try {
        await apiRequest(`/jobs/${jobId}/apply`, 'POST');
        alert('Applied successfully!');
      } catch (err) {}
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        phone: document.getElementById('phone').value,
        college: document.getElementById('college').value,
        branch: document.getElementById('branch').value,
        cgpa: parseFloat(document.getElementById('cgpa').value),
        skills: document.getElementById('skills').value,
        graduationYear: parseInt(document.getElementById('gradYear').value)
      };
      await apiRequest('/students/profile', 'PUT', body);
      alert('Profile updated!');
    });

    loadJobs();
  </script>
</body>
</html>
