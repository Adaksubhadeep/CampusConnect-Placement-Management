<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Portal | CampusConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <h2>CampusConnect - Admin Portal</h2>
    <button onclick="logout()" class="btn" style="background:#dc2626;">Logout</button>
  </nav>

  <div class="container">
    <h2>Institutional Metrics</h2>
    <div class="grid" style="margin-top: 1rem;">
      <div class="stat-box"><h3 id="totStud">0</h3><p>Registered Students</p></div>
      <div class="stat-box"><h3 id="totRec">0</h3><p>Active Recruiters</p></div>
      <div class="stat-box"><h3 id="totJobs">0</h3><p>Total Drives</p></div>
      <div class="stat-box"><h3 id="totApps">0</h3><p>Applications Submitted</p></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    checkAuth('admin');

    async function loadStats() {
      const stats = await apiRequest('/admin/dashboard');
      if (stats) {
        document.getElementById('totStud').innerText = stats.totalStudents;
        document.getElementById('totRec').innerText = stats.totalRecruiters;
        document.getElementById('totJobs').innerText = stats.totalJobs;
        document.getElementById('totApps').innerText = stats.totalApplications;
      }
    }

    loadStats();
  </script>
</body>
</html>
