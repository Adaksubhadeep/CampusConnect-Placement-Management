<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | CampusConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="max-width: 450px; margin-top: 5rem;">
    <div class="card">
      <h2>User Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Sign In</button>
      </form>
      <p style="margin-top: 1rem; text-align: center;">Need an account? <a href="register.html">Register</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await apiRequest('/auth/login', 'POST', { email, password });
        if (res) {
          localStorage.setItem('jwt_token', res.token);
          localStorage.setItem('user_role', res.role);
          localStorage.setItem('user_name', res.name);

          if (res.role === 'student') window.location.href = '/student-dashboard.html';
          else if (res.role === 'recruiter') window.location.href = '/recruiter-dashboard.html';
          else if (res.role === 'admin') window.location.href = '/admin-dashboard.html';
        }
      } catch (err) {}
    });
  </script>
</body>
</html>
