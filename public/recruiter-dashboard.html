<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recruiter Portal | CampusConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <h2>CampusConnect - Recruiter Portal</h2>
    <button onclick="logout()" class="btn" style="background:#dc2626;">Logout</button>
  </nav>

  <div class="container">
    <div class="card">
      <h3>Post a New Opening</h3>
      <form id="jobForm" class="grid" style="grid-template-columns: 1fr 1fr; margin-top: 1rem;">
        <div class="form-group"><label>Company Name</label><input type="text" id="compName" required></div>
        <div class="form-group"><label>Company Location</label><input type="text" id="compLoc" required></div>
        <div class="form-group"><label>Job Title</label><input type="text" id="title" required></div>
        <div class="form-group"><label>Job Location</label><input type="text" id="location" required></div>
        <div class="form-group"><label>Salary (LPA)</label><input type="number" id="salary" required></div>
        <div class="form-group"><label>Min CGPA</label><input type="number" step="0.1" id="minCgpa" required></div>
        <div class="form-group"><label>Required Skills</label><input type="text" id="skills" required></div>
        <div class="form-group"><label>Deadline</label><input type="date" id="deadline" required></div>
        <div class="form-group" style="grid-column: span 2;">
          <label>Job Description</label>
          <textarea id="description" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn" style="grid-column: span 2;">Publish Opportunity</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    checkAuth('recruiter');

    document.getElementById('jobForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        companyName: document.getElementById('compName').value,
        location: document.getElementById('location').value,
        title: document.getElementById('title').value,
        salary: parseInt(document.getElementById('salary').value),
        minCgpa: parseFloat(document.getElementById('minCgpa').value),
        skills: document.getElementById('skills').value,
        deadline: document.getElementById('deadline').value,
        description: document.getElementById('description').value
      };
      await apiRequest('/jobs', 'POST', body);
      alert('Job posted successfully!');
    });
  </script>
</body>
</html>
